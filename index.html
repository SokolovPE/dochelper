<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocHelper — список документов</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#243044;background:#f4f6fa}
*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1100px;margin:auto}
h1{margin:0 0 8px;font-size:28px}h2{font-size:19px;margin:0 0 18px}
.muted{color:#64748b;font-size:14px}.intro{margin:0 0 22px}
.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:#fff;border-radius:14px;padding:23px;box-shadow:0 2px 14px #0000000b;min-width:0}
.add,.actions,.copy-controls,.row-actions,.edit-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.add input{flex:1;min-width:140px}
input[type=text]{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:10px;min-width:0}
button{font:inherit;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;background:#2464d8;color:#fff}
button:hover:not(:disabled){filter:brightness(.94)}button:disabled{opacity:.35;cursor:not-allowed}
button.secondary{background:#eaf0fa;color:#25426a}button.danger{background:#fff0f1;color:#a52a36}
button.small{font-size:13px;padding:7px 9px}button.icon-button{min-width:32px;padding:7px 8px}
.actions{margin:15px 0 5px}.doc{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #e8edf3;min-width:0}
.doc-label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;overflow-wrap:anywhere}
.doc-label input{width:19px;height:19px;flex:none;accent-color:#2464d8}
.doc-name{min-width:0}.row-actions{gap:4px;flex:none}
.edit-row{flex:1;min-width:0}.edit-row input{width:100%;flex:1}
.result{background:#f6f8fb;border:1px solid #e1e8f1;border-radius:9px;padding:16px;min-height:105px;overflow-wrap:anywhere;white-space:pre-wrap}
.copy-controls{margin-top:15px}.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:#2464d8}
.warning{color:#9c1525;background:#fff0f1;padding:12px;border-radius:8px;margin:12px 0}
#feedback{min-height:20px;margin:9px 0 0}#feedback.ok{color:#167347}#feedback.bad{color:#a52a36}
@media(max-width:760px){body{padding:15px}.layout{grid-template-columns:1fr}.panel{padding:17px}.row-actions{gap:3px}button.small{padding:7px}.doc{gap:6px}}
</style>
</head>
<body>
<main>
<h1>DocHelper</h1>
<p class="muted intro">Отмечайте документы — итоговое сообщение формируется автоматически. Все изменения сохраняются в этом браузере.</p>
<p id="warning" class="warning" role="alert" hidden></p>
<div class="layout">
<section class="panel">
<h2>Документы</h2>
<form id="form" class="add"><input id="name" type="text" maxlength="200" required placeholder="Название документа" aria-label="Название документа"><button type="submit">Добавить</button></form>
<div class="actions">
<button type="button" id="select-all" class="secondary small">Выделить все</button>
<button type="button" id="clear" class="secondary small">Сбросить отметки</button>
</div>
<p id="count" class="muted"></p>
<div id="docs"></div>
</section>
<section class="panel">
<h2>Итоговое сообщение</h2>
<div id="result" class="result" aria-live="polite"></div>
<div class="copy-controls">
<button type="button" id="copy">Скопировать текст</button>
<label class="toggle"><input id="clear-on-copy" type="checkbox">Очищать при копировании</label>
</div>
<p id="feedback" class="muted" role="status" aria-live="polite"></p>
</section>
</div>
</main>
<script>
(function(){
'use strict';
const KEY='local-document-checklist-v1'; // Совместимо с первой версией
const PREF_KEY='local-document-checklist-clear-on-copy-v1';
const $=id=>document.getElementById(id);
let items=[], clearOnCopy=false, storageAvailable=true;
let feedbackTimer;
function warn(msg){$('warning').hidden=false;$('warning').textContent=msg;}
function store(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
    if(localStorage.getItem(key)!==JSON.stringify(value))throw Error('запись не подтверждена');
    return true;
  }catch(e){storageAvailable=false;warn('Не удалось сохранить данные: '+e.message+'. Проверьте режим браузера и разрешения на хранение данных.');return false;}
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw!==null){
      const parsed=JSON.parse(raw);
      if(!Array.isArray(parsed))throw Error('неверный формат списка');
      items=parsed.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string').map(x=>({id:x.id,name:x.name,checked:!!x.checked}));
    }
    const pref=localStorage.getItem(PREF_KEY);
    if(pref!==null)clearOnCopy=JSON.parse(pref)===true;
    const test='__dochelper_test__';
    localStorage.setItem(test,'ok');
    if(localStorage.getItem(test)!=='ok')throw Error('проверка записи не прошла');
    localStorage.removeItem(test);
  }catch(e){storageAvailable=false;warn('Не удалось загрузить или проверить хранилище: '+e.message);}
}
function save(){store(KEY,items);}
function selected(){return items.filter(x=>x.checked);}
function message(){
  const d=new Date(),date=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
  const names=selected().map(x=>x.name);
  return date+' / нет'+(names.length?' '+names.join(', '):'');
}
function update(){
  $('count').textContent='Всего: '+items.length+' · Отмечено: '+selected().length;
  $('result').textContent=message();
  $('select-all').disabled=!items.length||items.every(x=>x.checked);
  $('clear').disabled=!items.some(x=>x.checked);
}
function clearChecks(){
  items.forEach(x=>x.checked=false);
  save();render();
}
function makeButton(label,cls,title,handler){
  const b=document.createElement('button');
  b.type='button';b.className=cls;b.textContent=label;b.title=title;
  b.setAttribute('aria-label',title);b.addEventListener('click',handler);
  return b;
}
function render(){
  const root=$('docs');root.replaceChildren();
  if(!items.length){
    const p=document.createElement('p');p.className='muted';
    p.textContent='Пока нет документов. Добавьте первый выше.';root.append(p);
  }
  items.forEach((item,index)=>{
    const row=document.createElement('div');row.className='doc';
    const label=document.createElement('label');label.className='doc-label';
    const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=item.checked;
    checkbox.setAttribute('aria-label','Отметить: '+item.name);
    checkbox.addEventListener('change',()=>{item.checked=checkbox.checked;save();update();});
    const name=document.createElement('span');name.className='doc-name';name.textContent=item.name;
    label.append(checkbox,name);
    const controls=document.createElement('div');controls.className='row-actions';
    const up=makeButton('↑','secondary small icon-button','Переместить вверх: '+item.name,()=>move(index,-1));
    const down=makeButton('↓','secondary small icon-button','Переместить вниз: '+item.name,()=>move(index,1));
    up.disabled=index===0;down.disabled=index===items.length-1;
    const edit=makeButton('✎','secondary small icon-button','Редактировать: '+item.name,()=>startEdit(row,item));
    const del=makeButton('×','danger small icon-button','Удалить: '+item.name,()=>{
      items=items.filter(x=>x.id!==item.id);save();render();
    });
    controls.append(up,down,edit,del);row.append(label,controls);root.append(row);
  });
  update();
}
function startEdit(row,item){
  row.replaceChildren();
  const form=document.createElement('form');form.className='add edit-row';
  const input=document.createElement('input');input.type='text';input.maxLength=200;input.required=true;input.value=item.name;
  input.setAttribute('aria-label','Новое название документа');
  const saveButton=makeButton('Сохранить','small','Сохранить название',()=>{});
  saveButton.type='submit';
  const cancel=makeButton('Отмена','secondary small','Отменить редактирование',render);
  form.append(input,saveButton,cancel);row.append(form);input.focus();input.select();
  form.addEventListener('submit',e=>{
    e.preventDefault();const next=input.value.trim();if(!next)return;
    item.name=next;save();render();
  });
  input.addEventListener('keydown',e=>{if(e.key==='Escape')render();});
}
function move(index,delta){
  const next=index+delta;if(next<0||next>=items.length)return;
  [items[index],items[next]]=[items[next],items[index]];
  save();render();
}
function showFeedback(text,ok){
  clearTimeout(feedbackTimer);
  const el=$('feedback');el.textContent=text;el.className=ok?'ok':'bad';
  feedbackTimer=setTimeout(()=>{el.textContent='';el.className='muted';},2500);
}
async function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{await navigator.clipboard.writeText(text);return true;}catch(e){}
  }
  // Резервный способ для Safari и браузеров с ограниченным Clipboard API
  const area=document.createElement('textarea');
  area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';
  document.body.append(area);area.focus();area.select();
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  area.remove();return ok;
}
$('form').addEventListener('submit',e=>{
  e.preventDefault();const input=$('name'),name=input.value.trim();if(!name)return;
  items.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),name,checked:false});
  input.value='';save();render();input.focus();
});
$('select-all').addEventListener('click',()=>{
  items.forEach(x=>x.checked=true);save();render();
});
$('clear').addEventListener('click',clearChecks);
$('clear-on-copy').addEventListener('change',e=>{
  clearOnCopy=e.target.checked;store(PREF_KEY,clearOnCopy);
});
$('copy').addEventListener('click',async()=>{
  const text=message();const ok=await copyText(text);
  if(ok){
    if(clearOnCopy)clearChecks();
    showFeedback(clearOnCopy?'Скопировано. Отметки сброшены.':'Скопировано в буфер обмена.',true);
  }else{
    showFeedback('Не удалось скопировать. Выделите текст вручную.',false);
  }
});
window.addEventListener('focus',update);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)update();});
load();$('clear-on-copy').checked=clearOnCopy;render();
})();
</script>
</body>
</html>
