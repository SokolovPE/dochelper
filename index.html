<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Список документов</title>
<style>body{font:16px system-ui,Arial;background:#f4f6fa;color:#202b3c;margin:0;padding:28px}main{max-width:1050px;margin:auto}h1{font-size:26px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border-radius:14px;padding:24px;box-shadow:0 2px 14px #0001}.add{display:flex;gap:8px}input[type=text]{padding:11px;min-width:0;flex:1;border:1px solid #ccd3de;border-radius:8px;font:inherit}button{background:#2464d8;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit}.doc{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.doc label{display:flex;gap:10px;align-items:center;flex:1;overflow-wrap:anywhere}.doc input{width:19px;height:19px}.delete{background:#fff0f1;color:#a22;padding:7px 10px}.result{background:#f6f8fb;border:1px solid #e3e7ee;border-radius:9px;padding:16px;min-height:90px;overflow-wrap:anywhere}.muted{color:#697586;font-size:14px}.warning{color:#9c1525;background:#fff0f1;padding:12px;border-radius:8px;margin:12px 0}#copy{margin-top:14px}@media(max-width:700px){.layout{grid-template-columns:1fr}body{padding:14px}.panel{padding:17px}}</style></head>
<body><main><h1>Список документов</h1><p class="muted">Отмечайте документы — итоговый текст формируется автоматически.</p><p id="warning" class="warning" hidden></p><div class="layout"><section class="panel"><h2>Документы</h2><form id="form" class="add"><input id="name" type="text" maxlength="200" required placeholder="Название документа"><button>Добавить</button></form><p id="count" class="muted"></p><div id="docs"></div></section><section class="panel"><h2>Итоговое сообщение</h2><div id="result" class="result"></div><button id="copy" type="button">Скопировать текст</button></section></div></main>
<script>
(function () {
  'use strict';
  const KEY = 'local-document-checklist-v1';
  const $ = id => document.getElementById(id);
  const warning = $('warning');
  let items = [];
  function error(message) { warning.hidden = false; warning.textContent = message; }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(items));
      if (localStorage.getItem(KEY) !== JSON.stringify(items)) throw new Error('Проверка записи не прошла');
    } catch (e) { error('Не удалось сохранить данные в браузере: ' + e.message); }
  }
  try {
    const raw = localStorage.getItem(KEY);
    if (raw !== null) {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('Неверный формат сохранённых данных');
      items = parsed.filter(x => x && typeof x.name === 'string' && typeof x.id === 'string').map(x => ({id:x.id,name:x.name,checked:!!x.checked}));
    }
    const test = '__dochelper_test__';
    localStorage.setItem(test, 'ok');
    if (localStorage.getItem(test) !== 'ok') throw new Error('Запись не подтверждена');
    localStorage.removeItem(test);
  } catch (e) { error('Не удалось загрузить или проверить хранилище: ' + e.message); }
  function message() {
    const d = new Date();
    const date = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0');
    const selected = items.filter(x=>x.checked).map(x=>x.name);
    return date + ' / нет' + (selected.length ? ' ' + selected.join(', ') : '');
  }
  function render() {
    const root = $('docs');
    root.replaceChildren();
    if (!items.length) { const p=document.createElement('p'); p.className='muted'; p.textContent='Пока нет документов. Добавьте первый выше.'; root.append(p); }
    items.forEach(item => {
      const row=document.createElement('div'); row.className='doc';
      const label=document.createElement('label');
      const checkbox=document.createElement('input'); checkbox.type='checkbox'; checkbox.checked=item.checked;
      checkbox.addEventListener('change',()=>{item.checked=checkbox.checked;save();update();});
      const text=document.createElement('span'); text.textContent=item.name;
      label.append(checkbox,text);
      const del=document.createElement('button'); del.type='button'; del.className='delete'; del.textContent='Удалить';
      del.addEventListener('click',()=>{items=items.filter(x=>x.id!==item.id);save();render();});
      row.append(label,del);root.append(row);
    });
    update();
  }
  function update() { $('count').textContent='Всего: '+items.length+' · Отмечено: '+items.filter(x=>x.checked).length; $('result').textContent=message(); }
  $('form').addEventListener('submit',e=>{
    e.preventDefault(); const name=$('name').value.trim(); if(!name)return;
    items.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),name,checked:false});
    $('name').value='';save();render();$('name').focus();
  });
  $('copy').addEventListener('click',async()=>{
    try { await navigator.clipboard.writeText(message()); $('copy').textContent='Скопировано ✓'; }
    catch(e) { error('Не удалось скопировать текст автоматически. Выделите его вручную.'); }
    setTimeout(()=>$('copy').textContent='Скопировать текст',1500);
  });
  window.addEventListener('focus',update);
  render();
})();
</script></body></html>
